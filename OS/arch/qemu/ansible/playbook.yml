---
- name: Minimal Arch + Hyprland QEMU guest
  hosts: arch_qemu
  gather_facts: true

  vars:
    target_user: "{{ arch_user | default('nwassom') }}"
    target_home: "/home/{{ arch_user | default('nwassom') }}"

  tasks:
    - name: Install Hyprland, Ghostty, and the ReGreet login
      become: true
      ansible.builtin.package:
        name:
          - accountsservice
          - cage
          - dbus
          - foot
          - greetd
          - greetd-regreet
          - ghostty
          - hyprland
          - mesa
          - mesa-utils
          - ttf-dejavu
          - vulkan-virtio
          - xorg-xwayland
        state: present

    - name: Create the greetd configuration directory
      become: true
      ansible.builtin.file:
        path: /etc/greetd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure ReGreet in Cage
      become: true
      ansible.builtin.copy:
        src: files/greetd.toml
        dest: /etc/greetd/config.toml
        owner: root
        group: root
        mode: "0644"

    - name: Keep greetd enabled for graphical login
      become: true
      ansible.builtin.systemd_service:
        name: greetd.service
        enabled: true

    - name: Create the Hyprland config directory
      become: true
      ansible.builtin.file:
        path: "{{ target_home }}/.config/hypr"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0755"

    - name: Install the minimal Hyprland config
      become: true
      ansible.builtin.template:
        src: files/hyprland.conf
        dest: "{{ target_home }}/.config/hypr/hyprland.conf"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0644"

    - name: Keep Hyprland manual at login
      become: true
      ansible.builtin.copy:
        content: "[[ -f ~/.bashrc ]] && . ~/.bashrc\n"
        dest: "{{ target_home }}/.bash_profile"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0644"

    - name: Install the current boot-time reconfiguration helper
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../guest/provision-arch-hyprland.sh"
        dest: /usr/local/bin/provision-arch-hyprland
        owner: root
        group: root
        mode: "0755"
