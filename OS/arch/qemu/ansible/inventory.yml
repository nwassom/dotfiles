all:
  hosts:
    arch_qemu:
      ansible_host: "{{ lookup('env', 'ARCH_QEMU_HOST') }}"
      ansible_port: 2222
      ansible_user: nwassom
      ansible_ssh_private_key_file: "{{ lookup('env', 'ARCH_QEMU_IDENTITY') }}"
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
